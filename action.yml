name: "Upload Seperate Artifacts"
description: "Upload files as separate GitHub Actions artifacts without ZIP wrapping"
author: "your-github-username"

inputs:
  path:
    description: "Path(s) or glob(s) to files to upload directly. Supports comma/newline/space-separated patterns."
    required: true
  source:
    description: "Backward-compatible alias for path."
    required: false
  retention-days:
    description: "Number of days to keep the artifact."
    required: false
  overwrite:
    description: "Replace an existing artifact with the same name."
    required: false
  if-no-files-found:
    description: "What to do when no files match: warn, error, or ignore."
    required: false
    default: "warn"
  artifact-prefix:
    description: "Optional prefix added to each artifact name."
    required: false
    default: ""

outputs:
  artifacts:
    description: "JSON array of uploaded artifacts"
  volumes:
    description: "Number of uploaded artifacts"
  uploaded-artifacts:
    description: "Comma-separated list of uploaded artifact names"

runs:
  using: "node24"
  main: "index.js"

branding:
  icon: "archive"
  color: "blue"
